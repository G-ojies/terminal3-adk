[package]
name = "z-tenant-inference"
version = "0.1.0"
edition = "2021"
description = "LLM inference proxied through a T3N confidential-compute enclave — the provider key is sealed in tenant secrets and prompts never pass through the calling application"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
wit-bindgen = { version = "0.49", default-features = false, features = ["macros", "realloc"] }
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
# tenant_did() returns raw CompactDid bytes, hex-encoded once to build map names.
hex = { version = "0.4", default-features = false, features = ["alloc"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
